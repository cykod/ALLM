name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Live-provider tests are excluded by default in `test/test_helper.exs`
# (`:live_openai`, `:live_anthropic`, `:live_gemini`, `:live_openai_images`),
# so CI needs no provider API keys. The `examples/` live gate stays a manual,
# maintainer-run step — it costs real money per run.
env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    # The 1.19 leg reports without blocking — see `experimental` below.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The pinned toolchain (`.tool-versions`). Authoritative: every gate
          # blocks here.
          - elixir: "1.17.3"
            otp: "27.1.2"
            experimental: false
            pinned: true

          # `mix.exs` declares `elixir: "~> 1.17"`, which PERMITS 1.19 — and a
          # dependency's `lib/` compiles inside the consumer's project, so a
          # downstream app on 1.19 sees any `lib/` warning we do not. This leg
          # exists so that stops being invisible.
          #
          # TODO: flip `experimental` to false once the Elixir 1.19 type-checker
          # warnings in `test/**/*.exs` are cleared. As of this commit the 1.19
          # `mix test --warnings-as-errors` step is expected to FAIL (~59
          # warnings, test files only); `lib/` is already clean on 1.19.
          - elixir: "1.19"
            otp: "27"
            experimental: true
            pinned: false

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      # Formatter output differs between Elixir versions, so this gate is only
      # meaningful on the pinned toolchain — running it on 1.19 would report
      # diffs that are version drift, not unformatted code.
      - name: mix format --check-formatted
        if: matrix.pinned
        run: mix format --check-formatted

      # Split from the `test` step so a `lib/` warning is distinguishable from a
      # `test/` warning in the job log. `--warnings-as-errors` on `mix test`
      # applies to test files ONLY (see `mix help test`), which is exactly the
      # split we want to read on the 1.19 leg.
      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Test (warnings as errors)
        run: mix test --warnings-as-errors

      - name: Test at pinned seed
        if: matrix.pinned
        run: mix test --seed 0

      - name: mix credo --strict
        if: matrix.pinned
        run: mix credo --strict

      - name: Restore Dialyzer PLT
        if: matrix.pinned
        uses: actions/cache@v4
        with:
          path: _build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-

      # MUST run in `:dev`, not the job-wide `:test`. `elixirc_paths(:test)`
      # adds `test/support`, and analysing it fails with
      # `Function ExUnit.Assertions.assert/2 does not exist` (ExUnit is not in
      # the PLT) — `MIX_ENV=test mix dialyzer` exits 2 on a tree that is
      # otherwise clean. `:dev` is the invocation CLAUDE.md documents.
      - name: mix dialyzer
        if: matrix.pinned
        env:
          MIX_ENV: dev
        run: mix dialyzer

      # ExDoc autolinks any `Mod.fun/arity` in backticks and warns when the
      # target is private or `@doc false`; deliberate references are listed in
      # `mix.exs` under `skip_code_autolink_to`. This gate keeps that list
      # honest and catches genuinely broken doc references.
      - name: mix docs --warnings-as-errors
        if: matrix.pinned
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors

  # `conformance/` is a SECOND Mix project — the main project's gates do not
  # reach it. Its `mix format` check failed silently from Phase 14.1 until
  # 2026-08 precisely because nothing ran it.
  conformance:
    name: Conformance suite
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          elixir-version: "1.17.3"

      - name: Restore deps and _build
        uses: actions/cache@v4
        with:
          path: |
            conformance/deps
            conformance/_build
          key: ${{ runner.os }}-conformance-${{ hashFiles('conformance/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - run: mix deps.get
        working-directory: conformance

      - run: mix compile --force --warnings-as-errors
        working-directory: conformance

      - run: mix format --check-formatted
        working-directory: conformance

      - run: mix credo --strict
        working-directory: conformance

      - run: mix test
        working-directory: conformance
